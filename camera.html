<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OeHMIS Live Camera</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}.wrap{max-width:560px;margin:auto;padding:12px}.card{background:#222;border-radius:18px;padding:16px;box-shadow:0 4px 20px #0008}h2{margin:0 0 12px}.msg{padding:11px;border-radius:10px;background:#333;margin:10px 0;line-height:1.4}.camera{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:300px}.camera video{width:100%;display:block;transform:scaleX(-1)}.challenge{position:absolute;top:10px;left:10px;right:10px;background:#000c;padding:12px;text-align:center;border-radius:10px;font-size:20px;font-weight:800}.progress{height:8px;background:#444;border-radius:10px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:#21a366;transition:width .2s}.btn{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-size:17px;font-weight:700}.primary{background:#1677ff;color:#fff}.danger{background:#d93025;color:#fff}.ok{color:#66e08a;font-weight:700}.bad{color:#ff7777;font-weight:700}.small{font-size:13px;color:#bbb}.hidden{display:none!important}
</style>
<!-- MediaPipe Face Mesh runs entirely in the browser. No face image is uploaded to MediaPipe. -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
</head>
<body>
<div class="wrap"><div class="card">
<h2>OeHMIS Live Photo</h2>
<div id="info" class="msg">Starting front camera and face verification...</div>
<div class="camera"><video id="video" autoplay playsinline muted></video><div id="challenge" class="challenge">Preparing...</div></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="details" class="msg small">Follow the instruction shown above if possible. The Capture Live Photo button is fully manual and can be pressed whenever you are ready.</div>
<button id="capture" class="btn primary" disabled>📸 Capture Live Photo</button><button id="cancel" class="btn danger">Cancel</button>
</div></div>
<script>
const qs=new URLSearchParams(location.search);
const challenge=(qs.get('challenge')||'SMILE').toUpperCase();
const challengeId=challenge.replace(/\s+/g,'_');
let stream=null,faceMesh=null,processing=false,verified=false,captured=false;
let baseline=null,smileBaseline=null,blinkClosed=false,actionStart=0,lastProgress=0,frames=0;
const video=document.getElementById('video'),info=document.getElementById('info'),challengeEl=document.getElementById('challenge'),details=document.getElementById('details'),bar=document.getElementById('bar');
challengeEl.textContent=challenge;
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(faceMesh){try{faceMesh.close()}catch(e){}}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function ear(lm,idx){const a=dist(lm[idx[1]],lm[idx[5]]);const b=dist(lm[idx[2]],lm[idx[4]]);const c=dist(lm[idx[0]],lm[idx[3]]);return (a+b)/(2*c)}
function mouthRatio(lm){return dist(lm[13],lm[14])/Math.max(.0001,dist(lm[61],lm[291]))}
function nose(lm){return {x:lm[1].x,y:lm[1].y}}
function setProgress(v){v=Math.max(0,Math.min(100,v));if(v!==lastProgress){lastProgress=v;bar.style.width=v+'%'}}
function fail(msg){info.innerHTML='<span class="bad">'+msg+'</span>';details.textContent='Keep your face clearly visible and follow the instruction. The photo will be captured automatically after verification.'}
function verify(lm){
 if(!lm||lm.length<468){
   info.innerHTML='<span class="bad">Face not detected. Look at the camera.</span>';
   setProgress(0);
   return;
 }
 const left=lm[33],right=lm[263],top=lm[10],bottom=lm[152];
 const faceW=dist(left,right),faceH=dist(top,bottom);
 if(faceW<.12||faceH<.12){
   info.innerHTML='<span class="bad">Move closer so your face is clearly visible.</span>';
   setProgress(0);
   return;
 }
 info.innerHTML='<span class="ok">✓ Face detected. Follow the instruction if possible.</span>';
 setProgress(100);
}
async function init(){
 if(!window.opener||window.opener.closed){info.innerHTML='<span class="bad">Open Live Camera from the OeHMIS Attendance screen.</span>';return}
 if(!navigator.mediaDevices?.getUserMedia){fail('This browser does not support live camera.');return}
 try{
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'user'},width:{ideal:1280},height:{ideal:720}},audio:false});
 }catch(e){
   try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false})}
   catch(e2){fail('Front camera permission denied. Allow camera access and reopen Live Camera.');return}
 }
 video.srcObject=stream;await video.play();
 info.innerHTML='<span class="ok">✓ Camera ready. Capture is fully manual.</span>';
   document.getElementById('capture').disabled=false;
 try{
   faceMesh=new FaceMesh({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
   faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.65,minTrackingConfidence:.65});
   faceMesh.onResults(r=>{if(!processing&&r.multiFaceLandmarks?.length){verify(r.multiFaceLandmarks[0])}else if(!processing&&!verified){verify(null)}});
   processing=true;loop();
 }catch(e){fail('Face verification library could not start. Check internet access and reload.');}
}
async function loop(){if(captured)return;try{await faceMesh.send({image:video})}catch(e){}requestAnimationFrame(loop)}
function capture(){
 if(captured||!video.videoWidth)return;
 captured=true;
 processing=false;
 document.getElementById('capture').disabled=true;
 const c=document.createElement('canvas');
 const w=Math.min(video.videoWidth,900);
 const h=Math.round(w*video.videoHeight/video.videoWidth);
 c.width=w;c.height=h;
 const x=c.getContext('2d');
 // Mirror the front-camera image so the saved photo looks natural.
 x.translate(w,0);x.scale(-1,1);
 x.drawImage(video,0,0,w,h);
 x.setTransform(1,0,0,1,0,0);
 // Instruction watermark at the TOP of the saved photograph.
 x.fillStyle='rgba(0,0,0,.72)';
 x.fillRect(0,0,w,62);
 x.fillStyle='#fff';
 x.textAlign='center';
 x.font='bold 20px Arial';
 x.fillText('ACTION: '+challenge,w/2,25);
 x.font='bold 13px Arial';
 x.fillText('OeHMIS • LIVE PHOTO',w/2,47);
 x.textAlign='left';
 // Date/time watermark at the bottom.
 x.fillStyle='rgba(0,0,0,.62)';
 x.fillRect(0,h-42,w,42);
 x.fillStyle='#fff';
 x.font='bold 13px Arial';
 x.fillText(new Date().toLocaleString(),10,h-16);
 const data=c.toDataURL('image/jpeg',.82);
 stop();
 bar.style.width='100%';
 info.innerHTML='<span class="ok">✓ Live photo captured.</span>';
 details.textContent='Returning to OeHMIS...';
 if(window.opener&&!window.opener.closed){
   window.opener.postMessage({type:'OEHMIS_LIVE_PHOTO',photoData:data,challenge,verified:false,manualCapture:true},'*');
   setTimeout(()=>window.close(),700);
 }else{
   fail('OeHMIS window is no longer available.');
 }
}
document.getElementById('capture').onclick=capture;document.getElementById('cancel').onclick=()=>{stop();window.close()};window.addEventListener('beforeunload',stop);init();
</script></body></html>
